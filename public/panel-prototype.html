<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>checkto panel — direction comp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* =========================================================================
     TOKENS — lifted and extended from the Codex sidepanel build (see caption
     for the anchoring reference). Spacing/radius/type/motion scale is real,
     not invented: spacing base .25rem, radius scale x1.25, type 11/12/14/16/28/36,
     motion .15s / .3s with the two Codex eases, .5px hairline borders.
     ========================================================================= */
  :root{
    --spacing: .25rem;
    --sp-1: calc(var(--spacing) * 1);   /* 4px */
    --sp-2: calc(var(--spacing) * 2);   /* 8px */
    --sp-3: calc(var(--spacing) * 3);   /* 12px */
    --sp-4: calc(var(--spacing) * 4);   /* 16px */
    --sp-5: calc(var(--spacing) * 5);   /* 20px */
    --sp-6: calc(var(--spacing) * 6);   /* 24px */
    --sp-8: calc(var(--spacing) * 8);   /* 32px */

    --radius-scale: 1.25;
    --r-2:  calc(2px  * var(--radius-scale));
    --r-4:  calc(4px  * var(--radius-scale));
    --r-6:  calc(6px  * var(--radius-scale));
    --r-8:  calc(8px  * var(--radius-scale));
    --r-10: calc(10px * var(--radius-scale));
    --r-12: calc(12px * var(--radius-scale));
    --r-16: calc(16px * var(--radius-scale));
    --r-20: calc(20px * var(--radius-scale));
    --r-24: calc(24px * var(--radius-scale));

    --text-2xs: 11px;
    --text-xs: 12px;
    --text-sm: 14px;
    --text-md: 16px;
    --text-xl: 28px;
    --text-2xl: 36px;

    --dur-basic: .15s;
    --dur-relaxed: .3s;
    --ease-out: cubic-bezier(0, 0, .2, 1);
    --ease-enter: cubic-bezier(.23, 1, .32, 1);
    --hairline: .5px;

    /* ---- neutral ramp — TRUE neutral (chroma 0), shared by all four
       palettes below. The old ramp (#0f0e11 etc.) carried a hidden plum/blue
       cast (B>R>G in every stop) that fought whatever accent sat on it. An
       even OKLCH lightness ramp at C 0 removes that for good; only the
       accent and semantic tokens below vary per palette. ---- */
    --bg-page: oklch(0.14 0 0);
    --bg: oklch(0.17 0 0);
    --surface-1: oklch(0.21 0 0);
    --surface-2: oklch(0.25 0 0);
    --surface-3: oklch(0.30 0 0);
    --line: oklch(1 0 0 / 10%);
    --line-strong: oklch(1 0 0 / 16%);

    --text-1: oklch(0.95 0 0);
    --text-2: oklch(0.74 0 0);
    --text-3: oklch(0.62 0 0);

    /* ---- palette 3 (warm accent, done properly) as the :root fallback —
       overridden per palette below via [data-palette]. ---- */
    --accent: oklch(0.80 0.17 80);
    --accent-strong: oklch(0.86 0.15 80);
    --accent-ink: oklch(0.15 0 0);

    --status-success: oklch(0.72 0.13 145);
    --status-danger: oklch(0.68 0.17 25);
    --status-danger-bg: oklch(0.68 0.17 25 / 14%);
    --status-warning: oklch(0.72 0.17 45);
    --status-info: oklch(0.68 0.15 230);
    --dot-color: var(--text-3);

    --font-ui: "Archivo", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  /* =========================================================================
     PALETTES — the only thing this pass changes. Structure, layout, motion
     and the tick-track signature of designs 1 and 4 are untouched; only the
     tokens below swap per ?palette=1..4. Neutral ramp is identical across
     all four (see :root) so the comparison is accent-vs-accent, not
     background-vs-background.
     ========================================================================= */

  /* ---- palette 1: achromatic. No chroma anywhere except the tiny pending
     dot. Hierarchy is lightness and weight only. ---- */
  html[data-palette="1"]{
    --accent: oklch(0.98 0 0);
    --accent-strong: oklch(1 0 0);
    --accent-ink: oklch(0.14 0 0);
    --status-success: oklch(0.90 0 0);
    --status-danger: oklch(0.80 0 0);
    --status-danger-bg: oklch(1 0 0 / 8%);
    --status-warning: oklch(0.80 0 0);
    --status-info: oklch(0.80 0 0);
    --dot-color: oklch(0.75 0.09 220);
  }

  /* ---- palette 2: single cool accent. True neutrals + one cool hue (200,
     cyan-blue) for interactive elements only; status stays functional and
     desaturated; the dot stays neutral so the one hue reads as intentional. ---- */
  html[data-palette="2"]{
    --accent: oklch(0.75 0.12 200);
    --accent-strong: oklch(0.82 0.10 200);
    --accent-ink: oklch(0.15 0 0);
    --status-success: oklch(0.72 0.10 145);
    --status-danger: oklch(0.68 0.14 25);
    --status-danger-bg: oklch(0.68 0.14 25 / 14%);
    --status-warning: oklch(0.75 0.11 70);
    --status-info: oklch(0.72 0.09 205);
    --dot-color: var(--text-3);
  }

  /* ---- palette 3: single warm accent, done properly. Same gold family as
     the brand, but purer (higher C) and paired with a genuinely neutral
     near-black instead of a warm-tinted one, so it reads crisp, not muddy.
     Also the :root fallback above. ---- */
  html[data-palette="3"]{
    --accent: oklch(0.80 0.17 80);
    --accent-strong: oklch(0.86 0.15 80);
    --accent-ink: oklch(0.15 0 0);
    --status-success: oklch(0.72 0.13 145);
    --status-danger: oklch(0.68 0.17 25);
    --status-danger-bg: oklch(0.68 0.17 25 / 14%);
    --status-warning: oklch(0.72 0.17 45);
    --status-info: oklch(0.68 0.15 230);
    --dot-color: var(--text-3);
  }

  /* ---- palette 4: signal-only. No brand accent — interactive fills go
     neutral — colour appears only to carry meaning (running/done/failed/
     needs-you). The pending dot borrows status-info to make even that tiny
     mark a signal, not decoration. ---- */
  html[data-palette="4"]{
    --accent: oklch(0.92 0 0);
    --accent-strong: oklch(0.98 0 0);
    --accent-ink: oklch(0.15 0 0);
    --status-success: oklch(0.75 0.15 145);
    --status-danger: oklch(0.68 0.19 25);
    --status-danger-bg: oklch(0.68 0.19 25 / 14%);
    --status-warning: oklch(0.78 0.15 75);
    --status-info: oklch(0.72 0.12 230);
    --dot-color: var(--status-info);
  }
  html[data-palette="4"] .approval-lede .target{ color: var(--status-warning); }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg-page);
    font-family: var(--font-ui);
    color: var(--text-1);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--sp-6) var(--sp-4) var(--sp-8);
  }

  /* ---- caption -------------------------------------------------------- */
  .caption{
    width: min(560px, 100%);
    margin: 0 auto var(--sp-5);
    font-size: var(--text-xs);
    line-height: 1.55;
    color: var(--text-2);
  }
  .caption b{ color: var(--text-1); font-weight: 600; }
  .caption .design-name{
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--text-1);
    margin: 0 0 var(--sp-2);
    letter-spacing: -.01em;
  }
  .caption .axis-line{
    margin-top: var(--sp-2);
    color: var(--text-3);
  }
  .caption .palette-caption-name{ margin-top: var(--sp-4); }

  /* ---- panel shell ------------------------------------------------------ */
  .panel-frame{
    width: 400px;
    height: 820px;
    background: var(--bg);
    border-radius: var(--r-20);
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 60px rgba(0,0,0,.55);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .panel-frame[data-width="320"]{ width: 320px; }

  .panel-topbar{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--sp-3) var(--sp-4);
    border-bottom: var(--hairline) solid var(--line);
  }
  .panel-brand{
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--text-1);
  }
  .panel-brand .mark{
    width: 16px; height: 16px;
    border-radius: var(--r-4);
    background: var(--accent);
    flex: 0 0 auto;
  }
  .panel-topbar-meta{
    font-size: var(--text-2xs);
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .panel-body{
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .transcript{
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: var(--sp-4);
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
    /* Anchor content to the composer, not the topbar. The panel is tall and
       narrow; a short exchange used to leave a dead gap between the answer
       and the composer because flex-start left everything pinned to the
       top. Real chat surfaces anchor to the newest message at the bottom —
       flex-end does that without stretching or centering anything, and
       still scrolls normally once content exceeds the height. */
    justify-content: flex-end;
  }
  .transcript::-webkit-scrollbar{ width: 8px; }
  .transcript::-webkit-scrollbar-thumb{ background: var(--surface-3); border-radius: var(--r-8); }

  /* ---- empty state ------------------------------------------------------ */
  .empty-state{
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: var(--sp-6);
    gap: var(--sp-3);
  }
  .empty-state .empty-mark{
    font-size: var(--text-xl);
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--text-1);
  }
  .empty-state .empty-sub{
    font-size: var(--text-sm);
    color: var(--text-2);
    line-height: 1.5;
    max-width: 30ch;
  }
  .empty-state .empty-suggest{
    margin-top: var(--sp-3);
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }
  .suggest-row{
    font-size: var(--text-xs);
    color: var(--text-2);
    background: var(--surface-1);
    border-radius: var(--r-8);
    padding: var(--sp-2) var(--sp-3);
  }

  /* ---- user turn (shared across all four designs; not an axis) --------- */
  .msg-user{
    align-self: flex-end;
    max-width: 84%;
    background: var(--surface-2);
    color: var(--text-1);
    font-size: var(--text-sm);
    line-height: 1.5;
    padding: var(--sp-2) var(--sp-3);
    border-radius: var(--r-16) var(--r-16) var(--r-4) var(--r-16);
  }

  .msg-agent{
    align-self: stretch;
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }

  /* ---- status glyph: spinner -> check, transform/opacity only ---------- */
  .status-glyph{
    position: relative;
    width: 14px; height: 14px;
    flex: 0 0 auto;
    display: inline-grid;
    place-items: center;
  }
  .status-glyph .ring{
    position: absolute; inset: 0;
    border-radius: var(--r-24);
    border: 1.5px solid var(--line-strong);
    border-top-color: var(--text-2);
    opacity: 0;
    transform: scale(.8);
    transition: opacity var(--dur-basic) var(--ease-out), transform var(--dur-basic) var(--ease-out);
    animation: spin 0.9s linear infinite;
  }
  .status-glyph .dot{
    position: absolute; inset: 0;
    display: grid; place-items: center;
  }
  .status-glyph .dot::before{
    content:"";
    width: 5px; height: 5px;
    border-radius: var(--r-24);
    background: var(--dot-color);
    opacity: 0;
    transform: scale(.6);
    transition: opacity var(--dur-basic) var(--ease-out), transform var(--dur-basic) var(--ease-out);
  }
  .status-glyph .check{
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--status-success);
    opacity: 0;
    transform: scale(.6);
    transition: opacity var(--dur-relaxed) var(--ease-enter), transform var(--dur-relaxed) var(--ease-enter);
  }
  .status-glyph .check svg{ width: 12px; height: 12px; }

  .chev{
    width: 10px; height: 10px;
    flex: 0 0 auto;
    color: var(--text-3);
    transition: transform var(--dur-basic) var(--ease-out);
  }
  .status-glyph[data-state="active"] .ring{ opacity: 1; transform: scale(1); }
  .status-glyph[data-state="pending"] .dot::before{ opacity: 1; transform: scale(1); }
  .status-glyph[data-state="done"] .check{ opacity: 1; transform: scale(1); }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---- monospace tool-output panel, fades out instead of clipping ------ */
  .tool-output{
    font-family: var(--font-mono);
    font-size: var(--text-2xs);
    line-height: 1.6;
    color: var(--text-2);
    background: var(--surface-1);
    border-radius: var(--r-8);
    padding: var(--sp-3);
    max-height: 92px;
    overflow: hidden;
    position: relative;
    -webkit-mask-image: linear-gradient(to bottom, black 55%, transparent 96%);
    mask-image: linear-gradient(to bottom, black 55%, transparent 96%);
  }
  .tool-output .lang-tag{
    display:block;
    font-family: var(--font-ui);
    font-size: var(--text-2xs);
    color: var(--text-3);
    margin-bottom: var(--sp-1);
  }
  .tool-output .dim{ color: var(--text-3); }

  /* ---- pulsing dot: only for genuinely live streaming ------------------ */
  .live-dot{
    width: 6px; height: 6px;
    border-radius: var(--r-24);
    background: var(--status-info);
    flex: 0 0 auto;
    animation: live-pulse 1.6s var(--ease-in-out, ease-in-out) infinite;
  }
  @keyframes live-pulse{
    0%,100%{ opacity: 1; }
    50%{ opacity: .35; }
  }

  /* ---- shimmer for text still streaming --------------------------------- */
  .shimmer-text{
    color: var(--text-2);
    -webkit-mask-image: linear-gradient(90deg, black 30%, rgba(0,0,0,.3) 50%, black 70%);
    mask-image: linear-gradient(90deg, black 30%, rgba(0,0,0,.3) 50%, black 70%);
    -webkit-mask-size: 220% 100%;
    mask-size: 220% 100%;
    animation: shimmer-sweep 2s linear infinite;
  }
  @keyframes shimmer-sweep{
    0%{ -webkit-mask-position: 140% 0; mask-position: 140% 0; }
    100%{ -webkit-mask-position: -20% 0; mask-position: -20% 0; }
  }

  /* ---- shared composer --------------------------------------------------- */
  .composer{
    flex: 0 0 auto;
    padding: var(--sp-3) var(--sp-3) var(--sp-4);
    border-top: var(--hairline) solid var(--line);
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }
  .composer-field{
    background: var(--surface-1);
    border-radius: var(--r-16);
    padding: var(--sp-3);
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }
  .composer-field .placeholder{
    flex: 1 1 auto;
    font-size: var(--text-sm);
    color: var(--text-3);
  }
  .composer-actions{
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .composer-left{ display: flex; align-items: center; gap: var(--sp-2); }
  .icon-btn{
    width: 26px; height: 26px;
    border-radius: var(--r-8);
    background: var(--surface-1);
    color: var(--text-2);
    display: grid;
    place-items: center;
    font-size: var(--text-sm);
    border: none;
  }
  .model-pill{
    font-size: var(--text-2xs);
    color: var(--text-2);
    background: var(--surface-1);
    border-radius: var(--r-8);
    padding: var(--sp-1) var(--sp-2);
  }
  .send-btn{
    width: 28px; height: 28px;
    border-radius: var(--r-24);
    background: var(--accent);
    display: grid;
    place-items: center;
    border: none;
    flex: 0 0 auto;
  }
  .send-btn svg{ width: 14px; height: 14px; }
  .send-btn path{ fill: var(--accent-ink); }

  /* ---- answer separation, per design (axis D) --------------------------- */
  .answer{
    font-size: var(--text-sm);
    line-height: 1.55;
    color: var(--text-1);
    padding: 0 var(--sp-1);
  }
  .answer.sep-bg{
    background: var(--surface-1);
    border-radius: var(--r-10);
    padding: var(--sp-3);
  }
  .answer.sep-rule{
    border-top: var(--hairline) solid var(--line-strong);
    padding-top: var(--sp-3);
    margin-top: var(--sp-1);
  }
  .answer.sep-weight{
    font-size: var(--text-md);
    font-weight: 500;
    letter-spacing: -.005em;
  }

  /* ---- buttons ------------------------------------------------------- */
  .btn{
    font-family: var(--font-ui);
    font-size: var(--text-xs);
    font-weight: 500;
    border-radius: var(--r-8);
    padding: var(--sp-2) var(--sp-3);
    border: none;
    cursor: default;
    transition: transform var(--dur-basic) var(--ease-out), opacity var(--dur-basic) var(--ease-out);
  }
  .btn:active{ transform: scale(.97); }
  .btn-primary{ background: var(--accent); color: var(--accent-ink); }
  .btn-quiet{ background: var(--surface-2); color: var(--text-1); }
  .btn-ghost{ background: transparent; color: var(--text-2); }
  .btn-danger-text{ background: transparent; color: var(--status-danger); }

  /* ---- approval card (state 4) ------------------------------------------ */
  .approval{
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }
  .approval-lede{
    font-size: var(--text-sm);
    color: var(--text-1);
    line-height: 1.5;
  }
  .approval-lede .target{
    color: var(--accent);
    font-weight: 500;
  }
  .approval-options{
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }
  .approval-option{
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    padding: var(--sp-2) var(--sp-3);
    border-radius: var(--r-10);
    background: var(--surface-1);
  }
  .approval-option .radio{
    width: 14px; height: 14px;
    border-radius: var(--r-24);
    border: 1.5px solid var(--line-strong);
    flex: 0 0 auto;
  }
  .approval-option.is-recommended .radio{ border-color: var(--accent); background: var(--accent); }
  .approval-option-copy{ display: flex; flex-direction: column; gap: 2px; }
  .approval-option-title{ font-size: var(--text-sm); color: var(--text-1); }
  .approval-option-sub{ font-size: var(--text-2xs); color: var(--text-3); }
  .approval-footer{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: var(--sp-1);
  }

  /* ---- credential handoff (state 5) ------------------------------------ */
  .credential{
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }
  .credential-lede{ font-size: var(--text-sm); color: var(--text-1); line-height: 1.5; }
  .credential-form{
    background: var(--surface-1);
    border-radius: var(--r-12);
    padding: var(--sp-3);
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }
  .field{ display: flex; flex-direction: column; gap: var(--sp-1); }
  .field label{ font-size: var(--text-2xs); color: var(--text-3); }
  .field .input{
    background: var(--surface-2);
    border-radius: var(--r-8);
    padding: var(--sp-2) var(--sp-3);
    font-size: var(--text-sm);
    color: var(--text-1);
  }
  .field .input.is-masked{ letter-spacing: .2em; }
  .credential-note{
    display: flex;
    align-items: flex-start;
    gap: var(--sp-2);
    font-size: var(--text-2xs);
    color: var(--text-3);
    line-height: 1.5;
  }
  .credential-note svg{ flex: 0 0 auto; margin-top: 1px; }

  /* ---- blocked (state 6) ------------------------------------------------ */
  .blocked{
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
    align-items: flex-start;
  }
  .blocked-glyph{
    width: 32px; height: 32px;
    border-radius: var(--r-10);
    background: var(--status-danger-bg);
    color: var(--status-danger);
    display: grid;
    place-items: center;
  }
  .blocked-title{ font-size: var(--text-sm); font-weight: 600; color: var(--text-1); }
  .blocked-sub{ font-size: var(--text-xs); color: var(--text-2); line-height: 1.55; }
  .blocked-actions{ display: flex; gap: var(--sp-2); }

  .kbd{
    font-family: var(--font-mono);
    font-size: var(--text-2xs);
    background: var(--surface-2);
    border-radius: var(--r-4);
    padding: 1px 5px;
    color: var(--text-2);
  }

  /* =========================================================================
     DESIGN 1 — Quiet Ledger
     Trace fully collapsed behind the duration header (closest to the Codex
     structure). State lives inline in the transcript, nowhere else. Rows are
     plain. Answer gets the lightest possible separation: a soft background
     lift, nothing louder.
     ========================================================================= */
  .d1-run{ display: flex; flex-direction: column; gap: 0; }
  .d1-header{
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    padding: var(--sp-1) 0;
    font-size: var(--text-xs);
    color: var(--text-3);
    cursor: default;
  }
  .d1-header .chev{
    width: 10px; height: 10px;
    color: var(--text-3);
    transition: transform var(--dur-basic) var(--ease-out);
    flex: 0 0 auto;
  }
  .d1-header[data-open="true"] .chev{ transform: rotate(90deg); }
  .d1-collapse{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows var(--dur-relaxed) var(--ease-out);
  }
  .d1-collapse[data-open="true"]{ grid-template-rows: 1fr; }
  .d1-collapse-inner{ overflow: hidden; }
  .d1-steps{
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    padding: var(--sp-2) 0 var(--sp-3) var(--sp-1);
  }
  .d1-step{
    display: flex;
    align-items: flex-start;
    gap: var(--sp-2);
    font-size: var(--text-xs);
    color: var(--text-2);
    line-height: 1.5;
  }
  .d1-step .step-label{ flex: 1 1 auto; }
  .d1-step-detail{ margin: var(--sp-1) 0 0 22px; }

  /* =========================================================================
     DESIGN 2 — Status Strip
     A persistent strip stays docked under the topbar for the whole run,
     independent of transcript scroll. At rest, only the last two steps peek
     above a fade mask; older ones collapse behind a count. Actions render as
     tool chips. The answer gets the one deliberate rule in the whole family.
     ========================================================================= */
  .d2-strip{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-4);
    background: var(--surface-1);
    border-bottom: var(--hairline) solid var(--line);
  }
  .d2-strip .strip-phase{
    flex: 1 1 auto;
    font-size: var(--text-xs);
    color: var(--text-1);
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }
  .d2-strip .strip-time{
    font-size: var(--text-2xs);
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .d2-strip .strip-track{
    display: flex;
    gap: 3px;
  }
  .d2-strip .strip-seg{
    width: 12px; height: 3px;
    border-radius: var(--r-2);
    background: var(--surface-3);
  }
  .d2-strip .strip-seg.is-done{ background: var(--accent); }

  .d2-peek{
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    position: relative;
  }
  .d2-older-toggle{
    font-size: var(--text-2xs);
    color: var(--text-3);
    padding: var(--sp-1) 0;
  }
  .d2-older{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows var(--dur-relaxed) var(--ease-out);
  }
  .d2-older[data-open="true"]{ grid-template-rows: 1fr; }
  .d2-older-inner{ overflow: hidden; }
  .d2-older-list{ display: flex; flex-direction: column; gap: var(--sp-2); padding-top: var(--sp-2); }

  .tool-chip{
    display: inline-flex;
    align-items: center;
    gap: var(--sp-2);
    font-size: var(--text-xs);
    color: var(--text-2);
    background: var(--surface-1);
    border-radius: var(--r-8);
    padding: var(--sp-1) var(--sp-2);
    max-width: 100%;
  }
  .tool-chip .chip-verb{ color: var(--text-3); }
  .tool-chip .chip-target{
    color: var(--text-1);
    font-family: var(--font-mono);
    font-size: var(--text-2xs);
  }
  .d2-chip-row{ display: flex; flex-direction: column; gap: var(--sp-2); align-items: flex-start; }

  /* =========================================================================
     DESIGN 3 — Composer-Docked
     The trace stays open while the run is live — no collapse chrome mid-run —
     then condenses to a one-line ledger once finished. Live phase + elapsed
     is docked directly above the composer, not in the transcript. Actions are
     task rows with their own timers and result counts. Answer separates only
     by stepping up a type size/weight.
     ========================================================================= */
  .d3-hud{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--sp-2) var(--sp-3);
    margin: 0 var(--sp-3);
    background: var(--surface-1);
    border-radius: var(--r-10) var(--r-10) 0 0;
  }
  .d3-hud .hud-phase{
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    font-size: var(--text-xs);
    color: var(--text-1);
  }
  .d3-hud .hud-time{
    font-size: var(--text-2xs);
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .composer.has-hud{ padding-top: 0; }
  .composer.has-hud .composer-field{ border-radius: 0 0 var(--r-16) var(--r-16); margin: 0 var(--sp-3); }

  .d3-ledger-line{
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    font-size: var(--text-xs);
    color: var(--text-3);
    padding: var(--sp-1) 0;
  }
  .d3-tasks{ display: flex; flex-direction: column; gap: var(--sp-3); }
  .task-row{
    display: flex;
    flex-direction: column;
    gap: var(--sp-1);
    padding: var(--sp-2) var(--sp-3);
    background: var(--surface-1);
    border-radius: var(--r-10);
  }
  .task-row-top{
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }
  .task-row-label{ flex: 1 1 auto; font-size: var(--text-xs); color: var(--text-1); }
  .task-row-time{ font-size: var(--text-2xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .task-row-result{ font-size: var(--text-2xs); color: var(--text-3); padding-left: 22px; }

  /* =========================================================================
     DESIGN 4 — Marked Rows
     Trace collapses to a ledger identical in spirit to design 1 but carries a
     segmented tick track that fills in as steps land — the checking-off
     motion checkto is named for. A quiet elapsed indicator mirrors in the
     topbar while live. Rows are plain but each resolves to checkto's gold
     tick, not a generic checkmark. Answer gets a background lift like design
     1, but slightly deeper, marking it as the confirmed output.
     ========================================================================= */
  .d4-header{
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    padding: var(--sp-2) 0;
    cursor: default;
  }
  .d4-header .ticks{ display: flex; gap: 3px; }
  .d4-header .tick{
    width: 8px; height: 8px;
    border-radius: var(--r-2);
    background: var(--surface-3);
    transform: scale(1);
    transition: background-color var(--dur-relaxed) var(--ease-out), transform var(--dur-basic) var(--ease-enter);
  }
  .d4-header .tick.is-done{ background: var(--accent); }
  .d4-header .tick.is-landing{ transform: scale(1.25); }
  .d4-header-label{ font-size: var(--text-xs); color: var(--text-3); flex: 1 1 auto; }
  .d4-header .chev{
    width: 10px; height: 10px;
    color: var(--text-3);
    transition: transform var(--dur-basic) var(--ease-out);
  }
  .d4-header[data-open="true"] .chev{ transform: rotate(90deg); }
  .d4-collapse{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows var(--dur-relaxed) var(--ease-out);
  }
  .d4-collapse[data-open="true"]{ grid-template-rows: 1fr; }
  .d4-collapse-inner{ overflow: hidden; }
  .d4-steps{ display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2) 0 var(--sp-3) 0; }
  .d4-step{ display: flex; align-items: flex-start; gap: var(--sp-2); font-size: var(--text-xs); color: var(--text-2); line-height: 1.5; }
  .answer.sep-bg-deep{ background: var(--surface-2); border-radius: var(--r-12); padding: var(--sp-3); }
  .topbar-live{
    display: flex;
    align-items: center;
    gap: var(--sp-1);
    font-size: var(--text-2xs);
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: reduce){
    .status-glyph .ring{ animation: none; }
    .status-glyph[data-state="active"] .ring{ opacity: .8; animation: reduced-pulse 1.6s ease-in-out infinite; }
    .live-dot{ animation: none; opacity: .7; }
    .shimmer-text{ animation: none; -webkit-mask-image: none; mask-image: none; color: var(--text-1); }
    .d1-collapse, .d2-older, .d4-collapse, .panel-frame{ transition: none; }
  }
  @keyframes reduced-pulse{ 0%,100%{ opacity:.8; } 50%{ opacity:.35; } }

  /* =========================================================================
     PAGE CHROME — control dock, not part of the design under review.
     ========================================================================= */
  .dock{
    /* In normal flow, pinned to the left, below the panel — never a fixed
       overlay, so it can never sit on top of the panel being judged even
       when the viewport is exactly the panel's own width (400 or 320). */
    align-self: flex-start;
    margin-top: var(--sp-5);
    background: rgba(20,19,23,.92);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: var(--r-12);
    padding: var(--sp-2);
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    box-shadow: 0 12px 30px rgba(0,0,0,.5);
    font-family: var(--font-ui);
    backdrop-filter: blur(6px);
  }
  .dock-row{ display: flex; align-items: center; gap: 4px; }
  .dock-label{ font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: #6f6c78; width: 40px; flex: 0 0 auto; }
  .dock-btn{
    width: 22px; height: 22px;
    border-radius: var(--r-6);
    background: #232228;
    color: #a7a3ad;
    font-size: 10px;
    border: none;
    display: grid;
    place-items: center;
    font-family: var(--font-mono);
  }
  .dock-btn.is-active{ background: var(--accent); color: var(--accent-ink); }
  .dock-btn.wide{ width: auto; padding: 0 8px; font-family: var(--font-ui); font-size: 10px; }
  .dock-sep{ height: 1px; background: rgba(255,255,255,.08); margin: 2px 0; }
</style>
</head>
<body>

<div class="caption" id="caption"></div>
<div class="panel-frame" id="panelFrame" data-width="400">
  <div class="panel-topbar">
    <div class="panel-brand"><span class="mark"></span>checkto</div>
    <div class="panel-topbar-meta" id="topbarMeta"></div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<div class="dock" id="dock"></div>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------ */
  /* content — real, fixed across all designs                            */
  /* ------------------------------------------------------------------ */
  var TASK = "upload the quarterly report and confirm it went through";
  var STEPS = [
    { label: "Opened tab: ~/upload", time: 0.4, detail: null },
    { label: "Clicked the “upload” button", time: 1.1, detail: null },
    { label: "Typed “me@pcstyle.dev” into the “recipient” field", time: 0.8,
      detail: "The following is a diff from the previous\naccessibility tree for Window: “Upload / QRT” with ~ and\n+ representing changed and added elements.\n~ field[recipient] value=“me@pcstyle.dev”\n+ button[confirm] enabled=true" },
    { label: "Read the confirmation banner", time: 1.9, detail: null }
  ];
  var ANSWER = "uploaded it; the confirmation banner shows 3 files processed.";
  var APPROVAL_ACTION = "submit the $89.00 order";
  var BLOCKED_SITE = "vendorportal.io";

  var TOTAL_RUN_SECONDS = 28;

  /* ------------------------------------------------------------------ */
  /* icons                                                                */
  /* ------------------------------------------------------------------ */
  var ICON_CHEV = '<svg class="chev" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_LOCK = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.2"/></svg>';
  var ICON_BLOCK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.4"/><path d="M4.2 4.2l7.6 7.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  var ICON_SEND = '<svg viewBox="0 0 16 16"><path d="M3 8h9M8.5 4l4.5 4-4.5 4"/></svg>'.replace('<path d="M3 8h9M8.5 4l4.5 4-4.5 4"/>', '<path d="M3.5 8h8.2M8.2 4.3L12 8l-3.8 3.7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="currentColor"/>');

  function statusGlyph(state){
    return '<span class="status-glyph" data-state="' + state + '">' +
      '<span class="ring"></span><span class="dot"></span>' +
      '<span class="check">' + ICON_CHECK + '</span></span>';
  }

  /* ------------------------------------------------------------------ */
  /* shared blocks                                                       */
  /* ------------------------------------------------------------------ */
  function userTurn(){
    return '<div class="msg-user">' + TASK + '</div>';
  }

  function composer(opts){
    opts = opts || {};
    var hud = opts.hud ? opts.hud : "";
    return '<div class="composer' + (hud ? ' has-hud' : '') + '">' +
      hud +
      '<div class="composer-field"><span class="placeholder">Do anything</span></div>' +
      '<div class="composer-actions">' +
        '<div class="composer-left">' +
          '<button class="icon-btn">+</button>' +
          '<span class="model-pill">checkto‑1</span>' +
        '</div>' +
        '<button class="send-btn">' + ICON_SEND + '</button>' +
      '</div>' +
    '</div>';
  }

  function emptyState(){
    return '<div class="empty-state">' +
      '<div class="empty-mark">checkto</div>' +
      '<div class="empty-sub">Tell it what to do on a page and it will drive the browser for you, step by step.</div>' +
      '<div class="empty-suggest">' +
        '<div class="suggest-row">upload the quarterly report and confirm it went through</div>' +
        '<div class="suggest-row">check every open invoice for a matching PO number</div>' +
      '</div>' +
    '</div>';
  }

  function toolOutput(detail){
    if (!detail) return "";
    return '<div class="tool-output"><span class="lang-tag">plaintext</span>' +
      detail.split("\n").map(function(l){ return l.replace(/^~/,'<span class="dim">~</span>').replace(/^\+/,'<span class="dim">+</span>'); }).join("\n") +
      '</div>';
  }

  function approvalCard(designNum){
    var chipStyle = designNum === 2;
    var deepBg = designNum === 4;
    var options = [
      { title: "Allow once", sub: "Just this order", rec: true },
      { title: "Allow for this conversation", sub: "Any order in this task" },
      { title: "Always allow", sub: "Every order on this vendor" }
    ];
    var optRows = options.map(function(o){
      return '<div class="approval-option' + (o.rec ? ' is-recommended' : '') + '">' +
        '<span class="radio"></span>' +
        '<div class="approval-option-copy"><span class="approval-option-title">' + o.title + '</span>' +
        '<span class="approval-option-sub">' + o.sub + '</span></div></div>';
    }).join("");
    return '<div class="approval' + (deepBg ? ' answer sep-bg-deep' : (designNum !== 3 ? ' answer sep-bg' : '')) + '">' +
      '<div class="approval-lede">Before it goes further — okay to <span class="target">' + APPROVAL_ACTION + '</span>?</div>' +
      '<div class="approval-options">' + optRows + '</div>' +
      '<div class="approval-footer">' +
        '<button class="btn btn-danger-text">Deny</button>' +
        '<button class="btn btn-primary">Allow once</button>' +
      '</div>' +
    '</div>';
  }

  function credentialCard(designNum){
    var deepBg = designNum === 4;
    return '<div class="credential' + (deepBg ? ' answer sep-bg-deep' : (designNum !== 3 ? ' answer sep-bg' : '')) + '">' +
      '<div class="credential-lede">It needs you to sign in to <b>' + BLOCKED_SITE + '</b> to continue.</div>' +
      '<div class="credential-form">' +
        '<div class="field"><label>Email</label><div class="input">me@pcstyle.dev</div></div>' +
        '<div class="field"><label>Password</label><div class="input is-masked">••••••••••</div></div>' +
        '<button class="btn btn-primary">Continue</button>' +
      '</div>' +
      '<div class="credential-note">' + ICON_LOCK + '<span>Typed directly into the site. checkto cannot see or store what you type here.</span></div>' +
    '</div>';
  }

  function blockedCard(designNum){
    var deepBg = designNum === 4;
    return '<div class="blocked' + (deepBg ? ' answer sep-bg-deep' : (designNum !== 3 ? ' answer sep-bg' : '')) + '">' +
      '<div class="blocked-glyph">' + ICON_BLOCK + '</div>' +
      '<div class="blocked-title">Stopped at ' + BLOCKED_SITE + '</div>' +
      '<div class="blocked-sub">The CAPTCHA challenge failed twice on the upload form. Automated retries risk a longer lockout, so it stopped rather than keep guessing.</div>' +
      '<div class="blocked-actions">' +
        '<button class="btn btn-quiet">Open the tab</button>' +
        '<button class="btn btn-primary">Try again</button>' +
      '</div>' +
    '</div>';
  }

  /* ------------------------------------------------------------------ */
  /* design 1 — quiet ledger                                             */
  /* ------------------------------------------------------------------ */
  function d1Steps(includeDetail){
    return STEPS.map(function(s, i){
      return '<div class="d1-step">' + statusGlyph("done") +
        '<span class="step-label">' + s.label + '</span></div>' +
        (includeDetail && s.detail ? '<div class="d1-step-detail">' + toolOutput(s.detail) + '</div>' : "");
    }).join("");
  }

  function design1(state, elapsed){
    if (state === 1) return emptyState() + composer();
    var body = '<div class="transcript">' + userTurn();

    if (state === 2){
      body += '<div class="msg-agent"><div class="d1-run">' +
        '<div class="d1-header" data-open="true">' + statusGlyph("active") +
        '<span class="d1-live-label">Working — ' + elapsed + 's</span></div>' +
        '<div class="d1-collapse" data-open="true"><div class="d1-collapse-inner"><div class="d1-steps">' +
          d1Steps(false) +
          '<div class="d1-step">' + statusGlyph("active") + '<span class="step-label shimmer-text">Reading the confirmation banner…</span></div>' +
        '</div></div></div>' +
      '</div></div>';
    } else if (state === 3){
      body += '<div class="msg-agent"><div class="d1-run">' +
        '<div class="d1-header" data-open="false" id="d1toggle">' + ICON_CHEV +
        '<span>Worked for ' + TOTAL_RUN_SECONDS + 's</span></div>' +
        '<div class="d1-collapse" data-open="false" id="d1collapse"><div class="d1-collapse-inner"><div class="d1-steps">' +
          d1Steps(true) +
        '</div></div></div>' +
        '<div class="answer sep-bg">' + ANSWER + '</div>' +
      '</div></div>';
    } else if (state === 4){
      body += '<div class="msg-agent">' + approvalCard(1) + '</div>';
    } else if (state === 5){
      body += '<div class="msg-agent">' + credentialCard(1) + '</div>';
    } else if (state === 6){
      body += '<div class="msg-agent">' + blockedCard(1) + '</div>';
    }
    body += '</div>' + composer();
    return body;
  }

  /* ------------------------------------------------------------------ */
  /* design 2 — status strip                                             */
  /* ------------------------------------------------------------------ */
  function d2Chip(s, done){
    return '<div class="tool-chip">' + statusGlyph(done ? "done" : "active") +
      '<span class="chip-verb">' + (done ? "Ran" : "Running") + '</span>' +
      '<span class="chip-target">' + s.label + '</span></div>';
  }

  function d2Strip(phaseLabel, elapsed, doneCount, total){
    var segs = "";
    for (var i = 0; i < total; i++){
      segs += '<div class="strip-seg' + (i < doneCount ? ' is-done' : '') + '"></div>';
    }
    return '<div class="d2-strip"><div class="strip-phase">' +
      (elapsed !== null ? '<span class="live-dot"></span>' : "") +
      '<span>' + phaseLabel + '</span></div>' +
      '<div class="strip-track">' + segs + '</div>' +
      (elapsed !== null ? '<span class="strip-time">' + elapsed + 's</span>' : "") +
    '</div>';
  }

  function design2(state, elapsed){
    if (state === 1) return emptyState() + composer();
    var strip = "";
    if (state === 2) strip = d2Strip("Working on the upload", elapsed, 2, STEPS.length);
    var body = strip + '<div class="transcript">' + userTurn();

    if (state === 2){
      var recent = STEPS.slice(0, 2);
      var older = STEPS.slice(2);
      body += '<div class="msg-agent"><div class="d2-peek">' +
        '<div class="d2-chip-row">' + recent.map(function(s){ return d2Chip(s, true); }).join("") + '</div>' +
        '<div class="d2-chip-row">' + d2Chip({label:"Reading the confirmation banner"}, false) + '</div>' +
      '</div></div>';
    } else if (state === 3){
      body += '<div class="msg-agent"><div class="d2-peek">' +
        '<div class="d2-older-toggle" id="d2toggle">+ 2 earlier steps</div>' +
        '<div class="d2-older" data-open="false" id="d2older"><div class="d2-older-inner"><div class="d2-older-list">' +
          STEPS.slice(0,2).map(function(s){ return d2Chip(s, true); }).join("") +
        '</div></div></div>' +
        '<div class="d2-chip-row">' + STEPS.slice(2).map(function(s){ return d2Chip(s, true); }).join("") + '</div>' +
        (STEPS[2].detail ? toolOutput(STEPS[2].detail) : "") +
        '<div class="answer sep-rule">' + ANSWER + '</div>' +
      '</div></div>';
    } else if (state === 4){
      body += '<div class="msg-agent">' + approvalCard(2) + '</div>';
    } else if (state === 5){
      body += '<div class="msg-agent">' + credentialCard(2) + '</div>';
    } else if (state === 6){
      body += '<div class="msg-agent">' + blockedCard(2) + '</div>';
    }
    body += '</div>' + composer();
    return body;
  }

  /* ------------------------------------------------------------------ */
  /* design 3 — composer-docked                                          */
  /* ------------------------------------------------------------------ */
  function d3TaskRow(s, state){
    return '<div class="task-row"><div class="task-row-top">' + statusGlyph(state) +
      '<span class="task-row-label">' + s.label + '</span>' +
      (state === "done" ? '<span class="task-row-time">' + s.time + 's</span>' : "") +
    '</div></div>';
  }

  function design3(state, elapsed){
    var hud = "";
    if (state === 2){
      hud = '<div class="d3-hud"><span class="hud-phase"><span class="live-dot"></span>Working — reading the confirmation banner</span><span class="hud-time">' + elapsed + 's</span></div>';
    }
    if (state === 1) return emptyState() + composer();
    var body = '<div class="transcript">' + userTurn();

    if (state === 2){
      body += '<div class="msg-agent"><div class="d3-tasks">' +
        STEPS.map(function(s){ return d3TaskRow(s, "done"); }).join("") +
        d3TaskRow({label:"Reading the confirmation banner"}, "active") +
      '</div></div>';
    } else if (state === 3){
      body += '<div class="msg-agent">' +
        '<div class="d3-ledger-line" id="d3toggle">' + ICON_CHEV + '<span>' + STEPS.length + ' steps · ' + TOTAL_RUN_SECONDS + 's</span></div>' +
        '<div class="d1-collapse" data-open="false" id="d3collapse"><div class="d1-collapse-inner"><div class="d3-tasks" style="padding-top:8px;">' +
          STEPS.map(function(s){ return d3TaskRow(s, "done") + (s.detail ? '<div class="task-row-result">' + toolOutput(s.detail) + '</div>' : ""); }).join("") +
        '</div></div></div>' +
        '<div class="answer sep-weight">' + ANSWER + '</div>' +
      '</div>';
    } else if (state === 4){
      body += '<div class="msg-agent">' + approvalCard(3) + '</div>';
    } else if (state === 5){
      body += '<div class="msg-agent">' + credentialCard(3) + '</div>';
    } else if (state === 6){
      body += '<div class="msg-agent">' + blockedCard(3) + '</div>';
    }
    body += '</div>' + composer({ hud: hud });
    return body;
  }

  /* ------------------------------------------------------------------ */
  /* design 4 — marked rows                                              */
  /* ------------------------------------------------------------------ */
  function d4Ticks(doneCount, total, landing){
    var out = "";
    for (var i = 0; i < total; i++){
      out += '<span class="tick' + (i < doneCount ? ' is-done' : '') + (landing === i ? ' is-landing' : '') + '"></span>';
    }
    return '<span class="ticks">' + out + '</span>';
  }

  function design4(state, elapsed, tickPhase){
    if (state === 1) return emptyState() + composer();
    var body = '<div class="transcript">' + userTurn();

    if (state === 2){
      var doneCount = Math.min(STEPS.length, Math.floor((tickPhase || 0)));
      body += '<div class="msg-agent"><div class="d1-run">' +
        '<div class="d4-header">' + d4Ticks(doneCount, STEPS.length, doneCount) +
        '<span class="d4-header-label">Working — ' + elapsed + 's</span></div>' +
        '<div class="d4-steps">' +
          STEPS.slice(0, doneCount).map(function(s){ return '<div class="d4-step">' + statusGlyph("done") + '<span>' + s.label + '</span></div>'; }).join("") +
          (doneCount < STEPS.length ? '<div class="d4-step">' + statusGlyph("active") + '<span class="shimmer-text">' + STEPS[doneCount].label + '</span></div>' : "") +
        '</div>' +
      '</div></div>';
    } else if (state === 3){
      body += '<div class="msg-agent"><div class="d1-run">' +
        '<div class="d4-header" data-open="false" id="d4toggle">' + d4Ticks(STEPS.length, STEPS.length) +
        '<span class="d4-header-label">Worked for ' + TOTAL_RUN_SECONDS + 's</span>' + ICON_CHEV + '</div>' +
        '<div class="d4-collapse" data-open="false" id="d4collapse"><div class="d4-collapse-inner"><div class="d4-steps">' +
          STEPS.map(function(s){ return '<div class="d4-step">' + statusGlyph("done") + '<span>' + s.label + '</span></div>' + (s.detail ? toolOutput(s.detail) : ""); }).join("") +
        '</div></div></div>' +
        '<div class="answer sep-bg-deep">' + ANSWER + '</div>' +
      '</div></div>';
    } else if (state === 4){
      body += '<div class="msg-agent">' + approvalCard(4) + '</div>';
    } else if (state === 5){
      body += '<div class="msg-agent">' + credentialCard(4) + '</div>';
    } else if (state === 6){
      body += '<div class="msg-agent">' + blockedCard(4) + '</div>';
    }
    body += '</div>' + composer();
    return body;
  }

  /* ------------------------------------------------------------------ */
  /* captions                                                             */
  /* ------------------------------------------------------------------ */
  var CAPTIONS = {
    1: {
      name: "Design 1 — Quiet Ledger",
      body: "Archivo for interface text, IBM Plex Mono reserved for genuine tool output — a deliberate technical pairing, not Inter and not a serif default. " +
        "Structure is frozen from the design pass; only the palette below varies. Signature move: the run collapses fully behind a plain “Worked for Ns” line, exactly the Codex structure, transposed into checkto's own type.",
      axis: "Axis choices: trace collapsed at rest · state lives inline in the transcript · plain status rows · answer separated by the lightest background lift."
    },
    4: {
      name: "Design 4 — Marked Rows",
      body: "Same family type as design 1; structure frozen from the design pass, only the palette below varies. Signature move: a segmented tick track fills in as each step lands — the literal checking-off checkto is named for — sitting inside the same collapsed header structure as design 1 but reading completely differently while it runs.",
      axis: "Axis choices: trace collapsed at rest, but the header carries live tick progress · state lives inline · plain rows resolve to checkto's tick colour · answer gets the deepest background lift, marking it as the confirmed output."
    }
  };

  /* ------------------------------------------------------------------ */
  /* palette captions                                                     */
  /* ------------------------------------------------------------------ */
  var PALETTE_CAPTIONS = {
    1: {
      name: "Palette 1 — Achromatic",
      body: "Ramp: oklch(0.14→0.95 0 0) in 6 even steps, C 0 throughout — no hue anywhere in the ramp or the accent. " +
        "1 hue on screen at once, and only while a step is pending: the 5px dot on the status glyph borrows oklch(0.75 0.09 220), a soft blue, as the one functional exception. " +
        "Everything else — send button, ticks, checks, Deny — is neutral, told apart by lightness and weight only. Worst measured contrast: 4.88:1 (text-3 on surface-1)."
    },
    2: {
      name: "Palette 2 — Single Cool Accent",
      body: "Ramp: oklch(0.14→0.95 0 0) in 6 even steps, C 0, shared with every palette here. " +
        "Accent is oklch(0.75 0.12 200) — a cyan-leaning blue, picked specifically to sit outside the 250–320 indigo/violet band the AI default reaches for; used only on send, focus, and the live tick. " +
        "Status (success/danger/warning) stays separately hued but desaturated (C 0.10–0.14), so on a finished run you see 2 hues at once: the cyan accent plus the green done-check. Worst measured contrast: 4.88:1 (text-3 on surface-1)."
    },
    3: {
      name: "Palette 3 — Single Warm Accent, Done Properly",
      body: "Ramp: oklch(0.14→0.95 0 0) in 6 even steps, C 0 — the fix is not the neutral, it's what sits on it. " +
        "Accent is oklch(0.80 0.17 80), a purer, higher-chroma gold than the old #e3a72e, set against a genuinely neutral near-black instead of the old plum-tinted one, so it reads crisp instead of muddy. " +
        "2 hues on screen at once on a finished run: the gold accent plus the green done-check. Worst measured contrast: 4.88:1 (text-3 on surface-1)."
    },
    4: {
      name: "Palette 4 — Signal-Only",
      body: "Ramp: oklch(0.14→0.95 0 0) in 6 even steps, C 0. No brand accent — send, ticks, and primary buttons go neutral. " +
        "Colour exists only to mean something: green (145°) done, red (25°) failed/blocked, amber (75°) needs-you (the approval target text itself switches to this), blue (230°) running/pending, including the tiny status dot. " +
        "Up to 3 hues on screen at once on an approval card (amber target + neutral chrome + a green done-check above it). Worst measured contrast: 4.88:1 (text-3 on surface-1)."
    }
  };

  /* ------------------------------------------------------------------ */
  /* render / state                                                       */
  /* ------------------------------------------------------------------ */
  var RENDERERS = { 1: design1, 4: design4 };
  var liveTimer = null;
  var tickTimer = null;

  function clearTimers(){
    if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  function params(){
    var p = new URLSearchParams(location.search);
    var d = parseInt(p.get("design"), 10);
    var s = parseInt(p.get("state"), 10);
    var w = p.get("width");
    var pal = parseInt(p.get("palette"), 10);
    if (d !== 1 && d !== 4) d = 1;
    if (!(s >= 1 && s <= 6)) s = 3;
    if (w !== "320") w = "400";
    if (!(pal >= 1 && pal <= 4)) pal = 3;
    return { design: d, state: s, width: w, palette: pal };
  }

  function setParams(next, replace){
    var cur = params();
    var merged = Object.assign({}, cur, next);
    var url = new URL(location.href);
    url.searchParams.set("design", merged.design);
    url.searchParams.set("state", merged.state);
    url.searchParams.set("width", merged.width);
    url.searchParams.set("palette", merged.palette);
    history[replace ? "replaceState" : "pushState"]({}, "", url);
    render();
  }

  function render(){
    clearTimers();
    var st = params();
    document.documentElement.setAttribute("data-palette", st.palette);
    document.getElementById("panelFrame").setAttribute("data-width", st.width);

    var cap = CAPTIONS[st.design];
    var pcap = PALETTE_CAPTIONS[st.palette];
    document.getElementById("caption").innerHTML =
      '<div class="design-name">' + cap.name + '</div><div>' + cap.body + '</div>' +
      '<div class="axis-line">' + cap.axis + '</div>' +
      '<div class="design-name palette-caption-name">' + pcap.name + '</div><div>' + pcap.body + '</div>';

    var elapsed = 12;
    document.getElementById("panelBody").innerHTML = RENDERERS[st.design](st.state, elapsed);
    document.getElementById("topbarMeta").textContent = st.state === 2 ? "live" : "";

    wireInteractions(st);

    if (st.state === 2){
      var startedAt = Date.now();
      var base = 12;
      liveTimer = setInterval(function(){
        var secs = base + Math.floor((Date.now() - startedAt) / 1000);
        var el = document.querySelectorAll("[data-live-elapsed]");
        el.forEach(function(node){ node.textContent = secs + "s"; });
        var strip = document.querySelector(".d2-strip .strip-time");
        if (strip) strip.textContent = secs + "s";
        var hud = document.querySelector(".d3-hud .hud-time");
        if (hud) hud.textContent = secs + "s";
        var d4label = document.querySelector(".d4-header-label");
        if (d4label && st.design === 4) d4label.textContent = "Working — " + secs + "s";
        var d1label = document.querySelector(".d1-live-label");
        if (d1label && st.design === 1) d1label.textContent = "Working — " + secs + "s";
      }, 1000);

      if (st.design === 4){
        var phase = 0;
        tickTimer = setInterval(function(){
          phase = Math.min(STEPS.length, phase + 1);
          document.getElementById("panelBody").innerHTML = design4(2, 12, phase);
          wireInteractions(st);
          if (phase >= STEPS.length) clearInterval(tickTimer);
        }, 1400);
      }
    }
  }

  function toggle(id, headerSel){
    var el = document.getElementById(id);
    if (!el) return;
    var open = el.getAttribute("data-open") === "true";
    el.setAttribute("data-open", open ? "false" : "true");
    var header = document.querySelector(headerSel);
    if (header) header.setAttribute("data-open", open ? "false" : "true");
  }

  function wireInteractions(st){
    if (st.design === 1 && st.state === 3){
      var h = document.getElementById("d1toggle");
      if (h) h.addEventListener("click", function(){ toggle("d1collapse"); h.setAttribute("data-open", h.getAttribute("data-open") === "true" ? "false" : "true"); });
    }
    if (st.design === 2 && st.state === 3){
      var h2 = document.getElementById("d2toggle");
      if (h2) h2.addEventListener("click", function(){ toggle("d2older"); });
    }
    if (st.design === 3 && st.state === 3){
      var h3 = document.getElementById("d3toggle");
      if (h3) h3.addEventListener("click", function(){ toggle("d3collapse"); });
    }
    if (st.design === 4 && st.state === 3){
      var h4 = document.getElementById("d4toggle");
      if (h4) h4.addEventListener("click", function(){ toggle("d4collapse", "#d4toggle"); });
    }
  }

  /* ------------------------------------------------------------------ */
  /* dock                                                                 */
  /* ------------------------------------------------------------------ */
  function buildDock(){
    var st = params();
    var html = "";
    html += '<div class="dock-row"><span class="dock-label">design</span>';
    [1, 4].forEach(function(d){
      html += '<button class="dock-btn' + (st.design === d ? ' is-active' : '') + '" data-design="' + d + '">' + d + '</button>';
    });
    html += '</div>';
    html += '<div class="dock-row"><span class="dock-label">state</span>';
    for (var s = 1; s <= 6; s++){
      html += '<button class="dock-btn' + (st.state === s ? ' is-active' : '') + '" data-state="' + s + '">' + s + '</button>';
    }
    html += '</div>';
    html += '<div class="dock-row"><span class="dock-label">palette</span>';
    for (var pl = 1; pl <= 4; pl++){
      html += '<button class="dock-btn' + (st.palette === pl ? ' is-active' : '') + '" data-palette-btn="' + pl + '">' + pl + '</button>';
    }
    html += '</div>';
    html += '<div class="dock-sep"></div>';
    html += '<div class="dock-row">' +
      '<button class="dock-btn wide' + (st.width === "400" ? ' is-active' : '') + '" data-width="400">400px</button>' +
      '<button class="dock-btn wide' + (st.width === "320" ? ' is-active' : '') + '" data-width="320">320px</button>' +
    '</div>';
    var dock = document.getElementById("dock");
    dock.innerHTML = html;
    dock.querySelectorAll("[data-design]").forEach(function(btn){
      btn.addEventListener("click", function(){ setParams({ design: parseInt(btn.dataset.design, 10) }); buildDock(); });
    });
    dock.querySelectorAll("[data-state]").forEach(function(btn){
      btn.addEventListener("click", function(){ setParams({ state: parseInt(btn.dataset.state, 10) }); buildDock(); });
    });
    dock.querySelectorAll("[data-palette-btn]").forEach(function(btn){
      btn.addEventListener("click", function(){ setParams({ palette: parseInt(btn.dataset.paletteBtn, 10) }); buildDock(); });
    });
    dock.querySelectorAll("[data-width]").forEach(function(btn){
      btn.addEventListener("click", function(){ setParams({ width: btn.dataset.width }); buildDock(); });
    });
  }

  window.addEventListener("popstate", function(){ render(); buildDock(); });

  render();
  buildDock();
})();
</script>
</body>
</html>
