<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>checkto · recordings</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e0f11;color:#e6e6e6;font:16px/1.6 system-ui}header{padding:20px 5vw;border-bottom:1px solid #30343a;display:flex;gap:24px}a{color:#7cf5b1}main{max-width:1100px;margin:40px auto;padding:0 24px}h1{font-size:40px;margin-bottom:8px}p{color:#aab1bb}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:25px}article{background:#16181c;padding:20px;border:1px solid #30343a;border-radius:12px}h2{font-size:18px;overflow-wrap:anywhere}video{width:100%;background:#000;border-radius:6px}button{padding:10px 18px;background:#7cf5b1;border:0;border-radius:6px;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.5}.status{font-size:14px}</style><header><a href="/app">checkto</a><a href="/playground">playground</a></header><main><h1>Your recordings</h1><p>One video per chat. Stop recording to pause capture; end the chat in Checkto to prepare playback. Only chats recorded in this browser appear here.</p><button id="refresh">refresh</button><p id="notice" role="status"></p><div id="gallery"></div></main><script>
const gallery=document.querySelector('#gallery'),notice=document.querySelector('#notice');
async function refresh(){document.querySelector('#refresh').disabled=true;gallery.replaceChildren();const ids=JSON.parse(localStorage.getItem('checkto-recordings')||'[]').filter(id=>/^[a-f0-9]{16}$/.test(id)).reverse();notice.textContent=ids.length?'Loading recordings…':'No recordings yet. Start one in Checkto, run a task, then stop recording and end the chat.';
await Promise.all(ids.map(async id=>{const card=document.createElement('article');gallery.append(card);try{const r=await fetch('/api/recordings/'+id);const data=await r.json();if(!r.ok)throw new Error(data.error);const title=document.createElement('h2');title.textContent=data.title;const time=document.createElement('p');time.textContent=new Date(data.createdAt).toLocaleString();card.append(title,time);if(data.videos.length){for(const item of data.videos){const u=new URL(item.url);if(u.protocol!=='https:')continue;const video=document.createElement('video');video.controls=true;video.preload='metadata';video.src=u.href;const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener';a.textContent='open / download video';card.append(video,a)}}else{const p=document.createElement('p');p.className='status';p.textContent=data.state==='recording'?'Recording now.':data.state==='paused'?'Capture stopped. End this chat in Checkto to prepare playback.':'Anchor is preparing this video. Refresh shortly.';card.append(p)}}catch(e){card.textContent='Could not load recording: '+e.message}}));notice.textContent=ids.length?ids.length+' recorded chat'+(ids.length===1?'':'s'):notice.textContent;document.querySelector('#refresh').disabled=false}
document.querySelector('#refresh').onclick=refresh;refresh();
</script></html>
