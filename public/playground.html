<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>checkto · playground</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f2;color:#1c2925;font:16px/1.6 system-ui,sans-serif}header{padding:20px 5vw;border-bottom:1px solid #d5dcd5;display:flex;gap:24px;align-items:center}a{color:#235d4a}header a:first-child{font-weight:750;text-decoration:none}main{max-width:1100px;margin:40px auto;padding:0 24px}h1{font-size:42px;letter-spacing:-1.5px;line-height:1.15;margin:12px 0}h2{font-size:22px;margin:0 0 12px}p{color:#54615b}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin:28px 0}article,.workspace{background:white;border:1px solid #d5dcd5;border-radius:12px;padding:24px}article{display:flex;flex-direction:column}article .button{margin-top:auto;align-self:flex-start}article p{min-height:50px}pre{overflow-wrap:anywhere}.workspace{overflow-x:auto}button,.button{display:inline-block;padding:10px 16px;border:1px solid #bbc9c0;border-radius:6px;background:#e7eee9;color:#174b36;font:600 14px system-ui;cursor:pointer;text-decoration:none;margin:4px 5px 4px 0}button.primary,.button.primary{background:#235d4a;color:white;border-color:#235d4a}button:disabled{opacity:.5;cursor:wait}label{display:block;margin:16px 0}input,select,textarea,[contenteditable]{font:inherit;border:1px solid #b6c5bb;border-radius:5px;padding:9px;max-width:100%;background:white}input:not([type=checkbox]),textarea{display:block;width:100%}textarea{min-height:95px}pre{white-space:pre-wrap;font:14px/1.65 system-ui;background:#edf2ee;padding:18px;border-radius:8px}.pass{color:#216141;background:#e2f2e6;padding:16px}.fail{color:#7f4217;background:#fff0da;padding:16px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #d5dcd5}dialog{max-width:460px;border:1px solid #b6c5bb;border-radius:12px;padding:25px}#notice{min-height:28px}nav{display:flex;flex-wrap:wrap;gap:12px}.muted{font-size:13px;color:#54615b}[hidden]{display:none!important}
</style><header><a href="/">checkto</a><a href="/playground">playground</a><a href="/gallery">recordings</a></header><main id="main"></main>
<script>
const cases={
 form:{name:'01 / Contact form',detail:'Text fields, email, dropdowns and a checkbox.',goal:'Create a contact named Alex Morgan with email alex@example.com, team Product, and updates enabled. Save the contact.'},
 search:{name:'02 / Find the right order',detail:'Search, filter and choose between similar records.',goal:'Find the pending order for Juniper Studio and mark only order ORD-104 as shipped.'},
 edit:{name:'03 / Edit a document',detail:'Replace existing text in a rich text editor.',goal:'Rename the document to Launch notes and replace its entire body with: Ready for Friday. Save the document.'},
 delayed:{name:'04 / Slow save',detail:'A save takes eight seconds. Avoid duplicate submissions.',goal:'Set the project name to Autumn release and save it exactly once. Wait for confirmation.'},
 recovery:{name:'05 / Recover from a failure',detail:'The first save fails. Read the error and retry.',goal:'Set the project name to Autumn release. Save it, recover from the temporary failure, and verify the saved name.'},
 audit:{name:'06 / Invoice audit',detail:'12 records, delayed saves and one failed attempt.',goal:'Review all 12 invoices. Approve invoices with an attached receipt and hold those with a missing receipt. Retry any failed save, then finish the audit.'},
 dialog:{name:'07 / Confirm an action',detail:'A confirmation dialog and a reversible archive.',goal:'Archive the project Old campaign using the confirmation dialog. Leave Spring launch active.'},
 workflow:{name:'08 / Onboarding workflow',detail:'Complete a three-page form and review before submitting.',goal:'Complete onboarding for Alex Morgan, alex@example.com, team Product, plan Team, with updates enabled. Review the details and submit.'}
};
const params=new URLSearchParams(location.search),kind=params.get('task'),c=cases[kind];const main=document.querySelector('#main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!c){main.innerHTML='<div class="eyebrow">browser practice</div><h1>Give it something to do.</h1><p>Eight repeatable tasks, from one form to a 12-invoice audit. Use the same prompt in fast and careful mode to compare them.</p><div class="grid">'+Object.entries(cases).map(([k,v])=>'<article><h2>'+v.name+'</h2><p>'+v.detail+'</p><a class="button primary" href="?task='+k+'&run='+crypto.randomUUID()+'">open task & prompt</a></article>').join('')+'</div><p class="muted">All data is pretend and stays in the browser. Each task has a result check. Nothing is emailed, purchased or published.</p>'}
else {
 const key='checkto-playground-'+kind+'-'+(params.get('run')||'manual');let state=JSON.parse(localStorage.getItem(key)||'{}');
 const persist=()=>localStorage.setItem(key,JSON.stringify(state));
 const prompt='Go to '+location.href+' . '+c.goal+' Use Check result to verify completion.';
 main.innerHTML='<a href="/playground">← all tasks</a><h1>'+c.name+'</h1><p>'+c.detail+'</p><details open><summary>test prompt</summary><pre id="prompt"></pre><button id="copy">copy prompt</button><a id="use" class="button primary">use in checkto</a></details><p class="muted">Start recording in Checkto before sending the prompt. Use a fresh task link for a clean comparison.</p><div class="workspace" id="workspace"></div><nav><button id="check">Check result</button><button id="reset">Reset this task</button></nav><div id="result" role="status"></div>';
 document.querySelector('#prompt').textContent=prompt;document.querySelector('#use').href='/?prompt='+encodeURIComponent(prompt);
 document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(prompt);document.querySelector('#copy').textContent='copied'}catch{document.querySelector('#copy').textContent='select the prompt above to copy'}};
 document.querySelector('#reset').onclick=()=>{localStorage.removeItem(key);location.reload()};
 const w=document.querySelector('#workspace');
 function render(){
 if(kind==='form')w.innerHTML='<h2>New contact</h2><form><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Team<select name="team"><option>Choose a team</option><option>Product</option><option>Sales</option></select></label><label><input name="updates" type="checkbox"> Send updates</label><button class="primary">Save contact</button></form><p id="notice" role="status">'+(state.saved?'Contact saved: '+esc(state.saved.name):'')+'</p>';
 if(kind==='edit')w.innerHTML='<h2>Document</h2><form><label>Title<input name="title" value="'+esc(state.saved?.title||'Untitled draft')+'" required></label><label>Body<div role="textbox" aria-label="Body" contenteditable="true">'+esc(state.saved?.body||'Replace this old draft completely.')+'</div></label><button class="primary">Save document</button></form><p id="notice" role="status"></p>';
 if(['delayed','recovery'].includes(kind))w.innerHTML='<h2>Project settings</h2><form><label>Project name<input name="name" value="'+esc(state.saved?.name||'Untitled project')+'" required></label><button class="primary">Save project</button></form><p id="notice" role="status">'+(state.saved?'Saved project: '+esc(state.saved.name):'')+'</p>';
 if(kind==='search'){
 w.innerHTML='<h2>Orders</h2><label>Search customer<input id="search" type="search"></label><label>Status<select id="filter"><option>All</option><option>Pending</option><option>Shipped</option></select></label><table><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Action</th></tr></thead><tbody></tbody></table>';
 const orders=[['ORD-101','Juniper Studio','Shipped'],['ORD-102','Juniper Labs','Pending'],['ORD-103','Cedar Studio','Pending'],['ORD-104','Juniper Studio','Pending'],['ORD-105','Juniper Studio','Canceled']];
 const rows=()=>{w.querySelector('tbody').innerHTML=orders.filter(o=>o[1].toLowerCase().includes(w.querySelector('#search').value.toLowerCase())&&(w.querySelector('#filter').value==='All'||(state.shipped?.includes(o[0])?'Shipped':o[2])===w.querySelector('#filter').value)).map(o=>'<tr><td>'+o[0]+'</td><td>'+o[1]+'</td><td>'+(state.shipped?.includes(o[0])?'Shipped':o[2])+'</td><td>'+(o[2]==='Pending'&&!state.shipped?.includes(o[0])?'<button data-order="'+o[0]+'">Ship '+o[0]+'</button>':'—')+'</td></tr>').join('');w.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{state.shipped=[...(state.shipped||[]),b.dataset.order];persist();rows()})};w.querySelector('#search').oninput=rows;w.querySelector('#filter').onchange=rows;rows();
 }
 if(kind==='dialog'){
 w.innerHTML='<h2>Projects</h2><p>Old campaign · '+(state.archived?'Archived':'Active')+'</p><button id="archive" '+(state.archived?'disabled':'')+'>Archive Old campaign</button><p>Spring launch · Active</p><dialog><h2>Archive Old campaign?</h2><p>You can restore this project later.</p><button id="confirm">Confirm archive</button><button id="cancel">Cancel</button></dialog>';
 w.querySelector('#archive').onclick=()=>w.querySelector('dialog').showModal();w.querySelector('#cancel').onclick=()=>w.querySelector('dialog').close();w.querySelector('#confirm').onclick=()=>{state.archived=true;persist();render()};
 }
 if(kind==='workflow'){
 const step=state.step||1;const v=state.draft||{};
 w.innerHTML=state.saved?'<h2>Onboarding complete</h2><p>'+esc(state.saved.name)+' · '+esc(state.saved.team)+' · '+esc(state.saved.plan)+'</p>':'<h2>Step '+step+' of 3</h2><form>'+(step===1?'<label>Name<input name="name" value="'+esc(v.name||'')+'" required></label><label>Email<input name="email" type="email" value="'+esc(v.email||'')+'" required></label>':step===2?'<label>Team<select name="team"><option>Sales</option><option>Product</option></select></label><label>Plan<select name="plan"><option>Free</option><option>Team</option></select></label><label><input name="updates" type="checkbox"> Send updates</label>':'<p>Review: '+esc(v.name)+' · '+esc(v.email)+' · '+esc(v.team)+' · '+esc(v.plan)+' · updates '+(v.updates?'on':'off')+'</p>')+'<button class="primary">'+(step===3?'Submit onboarding':'Next')+'</button></form>';
 }
 if(kind==='audit'){
 const n=state.n||1;const saved=state.choices?.[n];
 w.innerHTML=state.finished?'<h2>Audit complete</h2><p>All 12 records submitted.</p>':'<h2>Invoice '+n+' of 12</h2><p>INV-'+(100+n)+' · receipt '+(n%3===0?'missing':'attached')+'</p><p>Approve invoices with receipts. Hold invoices without receipts.</p>'+(saved?'<p>Saved decision: '+saved+'</p><button id="next">'+(n===12?'Finish audit':'Next invoice')+'</button>':'<button data-decision="approve">Approve invoice</button><button data-decision="hold">Hold invoice</button>')+'<p id="notice" role="status"></p>';
 w.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{w.querySelectorAll('button').forEach(x=>x.disabled=true);b.textContent='Saving…';state.attempts||={};state.attempts[n]=(state.attempts[n]||0)+1;persist();await new Promise(r=>setTimeout(r,n===7?8000:800));if(n===5&&state.attempts[n]===1){render();w.querySelector('#notice').textContent='Temporary save failure. No change saved. Retry your decision.';return}state.choices||={};state.choices[n]=b.dataset.decision;persist();render()});
 if(w.querySelector('#next'))w.querySelector('#next').onclick=()=>{if(n===12)state.finished=true;else state.n=n+1;persist();render()};
 }
 const form=w.querySelector('form');if(form){const label=form.querySelector('button').textContent;form.oninput=()=>{const b=form.querySelector('button');if(b.textContent!=='Saving…'){b.disabled=false;b.textContent=label}}}if(form)form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));if(kind==='edit')data.body=w.querySelector('[contenteditable]').innerText;if(kind==='workflow'){state.draft={...state.draft,...data};if((state.step||1)<3){state.step=(state.step||1)+1;persist();render();return}state.saved=state.draft;persist();render();return}
 state.attempts=(state.attempts||0)+1;persist();const b=form.querySelector('button');b.disabled=true;b.textContent='Saving…';await new Promise(r=>setTimeout(r,kind==='delayed'?8000:kind==='recovery'?1500:250));if(kind==='recovery'&&state.attempts===1){b.disabled=false;b.textContent='Retry save';w.querySelector('#notice').textContent='Temporary save failure. Your changes were not saved. Retry save.';return}state.saved=data;persist();b.textContent='Saved';w.querySelector('#notice').textContent='Saved successfully: '+(data.name||data.title);};
 }
 document.querySelector('#check').onclick=()=>{const v=state.saved||{};const ok=kind==='form'?v.name==='Alex Morgan'&&v.email==='alex@example.com'&&v.team==='Product'&&v.updates==='on':kind==='edit'?v.title==='Launch notes'&&v.body==='Ready for Friday.':kind==='search'?state.shipped?.length===1&&state.shipped[0]==='ORD-104':kind==='dialog'?state.archived:kind==='workflow'?v.name==='Alex Morgan'&&v.email==='alex@example.com'&&v.team==='Product'&&v.plan==='Team'&&v.updates==='on':kind==='audit'?state.finished&&Array.from({length:12},(_,i)=>i+1).every(n=>state.choices?.[n]===(n%3===0?'hold':'approve')):v.name==='Autumn release'&&state.attempts===(kind==='delayed'?1:2);const result=document.querySelector('#result');result.className=ok?'pass':'fail';result.textContent=ok?'PASS — saved data matches the task.':'NOT COMPLETE — saved data does not yet match the prompt. Saved: '+JSON.stringify(state.saved||state.choices||state.shipped||state)};
 render();
}
</script></html>
