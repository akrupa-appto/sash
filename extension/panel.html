<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>checkto</title><link rel="stylesheet" href="style.css"></head>
<body class="panel-page">
<header class="panel-header"><span class="brand">checkto</span><div class="header-actions"><button class="text-button" id="new-chat">new</button><button class="text-button settings-link">settings</button></div></header>
<main class="content" id="content">
<div id="setup" class="notice" hidden><p>connect a model to start.</p><button class="settings-link secondary">open settings <span aria-hidden="true">↗</span></button></div>
<div id="permission" class="notice" hidden role="alertdialog" aria-labelledby="permission-title" aria-describedby="permission-detail"><h2 id="permission-title"></h2><p id="permission-detail"></p><div class="row"><button type="button" id="permission-allow"></button><button type="button" class="secondary" id="permission-deny"></button></div></div>
<div class="intro" id="intro">
<h1>what should i do<br>in <b>this tab?</b></h1>
<div class="tab-card" aria-hidden="true"><div class="tab-card-shot"><img id="tab-card-icon" alt="" hidden><span class="tab-card-mark" id="tab-card-mark">·</span><svg class="hand" viewBox="0 0 24 24"><path d="M4 2 L20 11 L12.5 12.8 L9.5 20 Z" fill="#FFB48A" stroke="#171020" stroke-width="1.4" stroke-linejoin="round"/></svg></div><div class="tab-card-foot"><span id="tab-card-title">no tab yet</span><span>or type @ for another</span></div></div>
<p>say it like you would to a person. it reads the page, clicks, and tells you when it's done.</p>
<div class="examples"><button data-task="summarize this page">summarize this page</button><button data-task="compare these tabs">compare tabs</button></div>
</div>
<div id="messages" aria-live="polite"></div>
<div class="trace is-live" id="steps-wrap" hidden><div class="trace-header" id="steps-label" role="group"></div><div class="trace-body"><div id="steps"></div></div></div>
<div class="duration" id="live-duration" hidden></div>
</main>
<form class="composer" id="task-form">
<div class="run-status" id="run-status"><span class="dot"></span><span id="status-text">ready</span><span class="cost" id="cost"></span></div>
<div class="notice blocked-card" id="blocked" hidden><p class="blocked-reason" id="blocked-text"></p></div>
<div id="request" hidden></div>
<div class="mode-row"><button type="button" class="text-button settings-link" id="model-link" title="change the planner model in settings"></button><label class="sr-only" for="mode">agent mode</label><select id="mode"><option value="careful">careful</option><option value="fast">fast</option></select></div>
<div class="compose-box">
<div class="tab-picker" id="tab-picker" hidden><div class="picker-heading"><span>open tabs</span><span id="tab-count"></span></div><div id="tab-results" role="listbox" aria-label="open tabs"></div><div class="picker-footer">↑ ↓ to browse <span>enter to add · esc to close</span></div></div>
<div class="selected-tabs" id="selected-tabs" aria-label="referenced tabs"></div>
<div class="compose-row"><button class="mention-button" type="button" id="mention-tabs" title="add a tab" aria-label="add a tab">@</button><label class="sr-only" for="goal">message checkto</label><textarea id="goal" placeholder="say what you need" required maxlength="10000" rows="1" aria-autocomplete="list" aria-controls="tab-results" aria-expanded="false"></textarea><button id="send" class="send-button" type="submit" aria-label="send task" title="send task">↑</button><button id="stop" class="stop-button" type="button" hidden aria-label="stop task" title="stop task">■</button></div>
</div>
<div class="status error" id="error" role="alert"></div><div class="composer-caption"><span id="tab-context">all your tabs, one conversation</span><span>↵ send</span></div>
</form><script type="module" src="panel.js"></script></body></html>
