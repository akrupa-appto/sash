<!doctype html><html><head><meta charset="utf-8"><title>Sash extension test</title><style>body{font:18px system-ui;max-width:650px;margin:50px auto;background:#edf4ee;color:#16261c}label{display:block;margin:16px 0}input,select,button,[contenteditable]{padding:10px;font:inherit}#result{padding:20px;border:1px solid #6b947a}#spacer{height:1000px}</style></head><body>
<h1>browser task fixture</h1><p>a local form for checking browser control.</p>
<form id="form"><label>name <input aria-label="name" name="name" value="replace me"></label><label>quantity <input aria-label="quantity" type="number" value="12"></label><label>date <input aria-label="date" type="date"></label><label>password <input aria-label="password" type="password" value="must-not-reach-model"></label><label>plan <select aria-label="plan"><option>basic</option><option>team</option><option>business</option></select></label><label>note <div aria-label="note" contenteditable="true">old note</div></label><button>save</button></form><p id="result">not saved</p><a href="?next=1" id="next">next page</a> <a href="?popup=1" target="_blank">open details</a><div id="spacer"></div><button id="bottom">bottom control</button>
<script>document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#result').textContent='saved: '+document.querySelector('[name=name]').value+' / '+document.querySelector('select').value};document.querySelector('#bottom').onclick=()=>document.querySelector('#bottom').textContent='clicked bottom';if(location.search)document.title='Next fixture page';</script>
</body></html>
