name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # builds the extension bundle first (pretest), then every unit test file
      - run: npm test
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: checkto-extension-${{ github.sha }}
          path: dist/checkto-extension.zip
          retention-days: 14
