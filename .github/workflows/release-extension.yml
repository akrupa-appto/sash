name: release extension

# Every merge to main that touches the extension or the code it bundles bumps the manifest patch
# version, commits it back, tags extension-vX.Y.Z, and publishes a release with the zip.
on:
  push:
    branches: [main]
    paths:
      - extension/**
      - src/snapshot.js
      - src/agent.ts
      - src/planner.ts
      - src/providers.ts
      - src/transcribe.ts
      - src/jev.ts
      - public/model-picker.js
      - scripts/build-extension.mjs
      - scripts/package-extension.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      part:
        description: version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release-extension
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # the bump commit itself must not trigger another release
    if: "${{ github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore: extension v') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tests/extension-voice-browser.test.mjs and the other browser suites load the built extension
      # in a real Chromium, so the release job needs the browser installed exactly like ci.yml does.
      # Without this the job failed on every merge that touched the extension: no version bump, no release.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - id: bump
        # Keep bumping until the tag is free, so a retried or raced run never collides with an existing tag.
        run: |
          git fetch --tags --force
          version=$(node scripts/bump-extension.mjs ${{ inputs.part || 'patch' }})
          while git rev-parse -q --verify "refs/tags/extension-v$version" >/dev/null; do
            version=$(node scripts/bump-extension.mjs patch)
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run package:extension
      - name: commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json
          git commit -m "chore: extension v${{ steps.bump.outputs.version }}"
          git tag -a "extension-v${{ steps.bump.outputs.version }}" -m "sash extension v${{ steps.bump.outputs.version }}"
          # atomic: main and the tag land together, or neither does
          git push --atomic origin HEAD:main "refs/tags/extension-v${{ steps.bump.outputs.version }}"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "extension-v${{ steps.bump.outputs.version }}" dist/sash-extension.zip \
            --title "sash extension v${{ steps.bump.outputs.version }}" \
            --notes "Built from ${{ github.sha }}. Unzip and load the folder unpacked at chrome://extensions (Developer mode). See extension/README.md."
